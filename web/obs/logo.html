<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Music Life — logo de la chaîne (OBS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Barlow+Condensed:ital,wght@1,800&display=block" rel="stylesheet">
<style>
  /* Fond transparent : dans OBS, seul le logo apparaît au-dessus de la vidéo. */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  canvas { display: block; width: 100vw; height: auto; }
  /* Mode téléchargement (?png) : petit panneau d'aide, jamais visible dans OBS. */
  body.png { background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 0 0 / 24px 24px; font-family: system-ui, sans-serif; overflow: auto; }
  body.png canvas { width: min(90vw, 900px); margin: 40px auto 16px; }
  .panel { display: none; text-align: center; padding-bottom: 40px; }
  body.png .panel { display: block; }
  .panel a { display: inline-block; margin: 6px; padding: 12px 20px; border-radius: 12px; background: #7A12C4; color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="Logo Music Life"></canvas>
<div class="panel">
  <a id="dl1" download="music-life-logo.png" href="#">Télécharger le PNG (1280 px)</a>
  <a id="dl2" download="music-life-logo-4k.png" href="#">Télécharger le PNG (2560 px)</a>
</div>
<script>
'use strict';
// Réglages via l'adresse : ?toutes=60 (secondes entre deux reflets), ?duree=1.6, ?png (page de téléchargement)
const params = new URLSearchParams(location.search);
const EVERY = Math.max(5, Number(params.get('toutes')) || 60) * 1000;
const SWEEP = Math.max(0.4, Number(params.get('duree')) || 1.6) * 1000;
const PNG_MODE = params.has('png');
if (PNG_MODE) document.body.classList.add('png');

// Dessin de référence 640 × 262 (identique au logo de l'appli)
const W = 640, H = 262, PAD = 10, TILT = -2 * Math.PI / 180;
const PLATE = [[8,6],[22.6,6.5],[37.3,9.2],[51.9,6.1],[66.6,6.5],[81.2,7.1],[95.9,4.4],[110.5,6.8],[125.2,7.7],[139.8,9],[154.5,4.2],[169.2,5.7],[183.8,4.3],[198.5,9.5],[213.1,8.8],[227.8,4.3],[242.4,11],[257,11],[271.7,8.9],[286.3,8.7],[301,5.6],[315.7,4.7],[330.3,8.4],[344.9,5.2],[359.6,6.2],[374.2,6.7],[388.9,5.3],[403.6,8.4],[418.2,8.4],[432.8,11.3],[447.5,9.1],[462.2,10.1],[476.8,9.2],[491.4,10.4],[506.1,9.1],[520.8,7.9],[535.4,13.1],[550.1,13.2],[564.7,12.2],[579.4,11.4],[594,10],[591,24],[591.3,38],[588.8,52],[595.5,66],[591.6,80],[595.8,94],[590.9,108],[596.3,122],[594.9,136],[586.1,150],[588,164],[594.7,178],[590,192],[590,206],[575.4,205.2],[560.7,202.8],[546,206.6],[531.4,207.5],[516.8,203.9],[502.1,202.5],[487.4,204.1],[472.8,208.4],[458.1,206.9],[443.5,202.3],[428.9,203.1],[414.2,202],[399.5,201.6],[384.9,206.7],[370.2,202.2],[355.6,204.8],[341,203.9],[326.3,202],[311.7,205.7],[297,201.4],[282.3,204.9],[267.7,201.1],[253.1,203.1],[238.4,201.6],[223.8,201.9],[209.1,206.7],[194.4,205.4],[179.8,201.8],[165.2,205.8],[150.5,201],[135.8,202.2],[121.2,205.3],[106.6,203.7],[91.9,199.8],[77.2,205.9],[62.6,200.4],[47.9,200.6],[33.3,204.1],[18.6,200.9],[4,202],[0,188],[0.5,174],[5.7,160],[2.6,146],[6.4,132],[4.4,118],[5.5,104],[10.9,90],[6.4,76],[7.6,62],[10.8,48],[4.3,34],[4.3,20]];

function spaced(ctx, text, x, y, spacing) {
  // Texte centré avec espacement des lettres (comme letterSpacing dans l'appli)
  const widths = [...text].map(ch => ctx.measureText(ch).width);
  const total = widths.reduce((a, b) => a + b, 0) + spacing * text.length;
  let cx = x - total / 2;
  [...text].forEach((ch, i) => { ctx.fillText(ch, cx, y); cx += widths[i] + spacing; });
  return total;
}

/** Dessine le logo complet (sans reflet) dans un contexte à l'échelle s. */
function drawLogo(ctx, s) {
  ctx.save();
  ctx.scale(s, s);
  ctx.translate(PAD, PAD);
  // Plaque blanche déchirée + « Music »
  ctx.save();
  ctx.translate(20 + 300, 8 + 106); ctx.rotate(TILT); ctx.translate(-300, -106);
  ctx.beginPath(); PLATE.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath();
  ctx.fillStyle = '#FFFFFF'; ctx.fill();
  ctx.fillStyle = '#111014';
  ctx.font = '148px "Permanent Marker"';
  ctx.textBaseline = 'middle';
  spaced(ctx, 'Music', 300, 112, 4);
  ctx.restore();
  // Pastille « LIFE » : dégradé violet + contour sombre
  ctx.font = 'italic 800 40px "Barlow Condensed"';
  const tw = [...'LIFE'].reduce((a, ch) => a + ctx.measureText(ch).width, 0) + 8 * 4;
  const pw = 30 + tw + 34 + 10, ph = 4 + 44 + 6 + 10;
  const right = W - 44, bottom = H - 6;
  ctx.save();
  ctx.translate(right - pw / 2, bottom - ph / 2); ctx.rotate(TILT);
  const x0 = -pw / 2, y0 = -ph / 2, r = ph / 2;
  ctx.beginPath(); ctx.roundRect(x0, y0, pw, ph, r); ctx.fillStyle = '#14001F'; ctx.fill();
  const g = ctx.createLinearGradient(x0 + 5, y0 + 5, x0 + pw - 5, y0 + ph - 5);
  g.addColorStop(0, '#7A12C4'); g.addColorStop(0.5, '#4B0082'); g.addColorStop(1, '#22003A');
  ctx.beginPath(); ctx.roundRect(x0 + 5, y0 + 5, pw - 10, ph - 10, r - 5); ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = '#FFFFFF'; ctx.textBaseline = 'middle';
  spaced(ctx, 'LIFE', 4 - 2, 0, 8);
  ctx.restore();
  ctx.restore();
}

/** Bande de lumière en biais, limitée à la forme du logo (position p de 0 à 1). */
function drawShine(ctx, s, p) {
  const fullW = (W + 2 * PAD) * s, fullH = (H + 2 * PAD) * s;
  const band = fullW * 0.22;
  const cx = -band + p * (fullW + 2 * band);
  ctx.save();
  ctx.globalCompositeOperation = 'source-atop';
  ctx.translate(cx, fullH / 2); ctx.rotate(20 * Math.PI / 180);
  const g = ctx.createLinearGradient(-band / 2, 0, band / 2, 0);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(0.45, 'rgba(255,255,255,0.55)');
  g.addColorStop(0.5, 'rgba(255,255,255,0.85)');
  g.addColorStop(0.55, 'rgba(255,255,255,0.55)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(-band / 2, -fullH * 1.5, band, fullH * 3);
  ctx.restore();
}

function renderTo(canvas, s, p) {
  canvas.width = Math.round((W + 2 * PAD) * s);
  canvas.height = Math.round((H + 2 * PAD) * s);
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawLogo(ctx, s);
  if (p != null) drawShine(ctx, s, p);
}

const canvas = document.getElementById('c');
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function scale() {
  const cssW = PNG_MODE ? Math.min(innerWidth * 0.9, 900) : innerWidth;
  return (cssW / (W + 2 * PAD)) * (window.devicePixelRatio || 1);
}

let sweepStart = null;
function frame(now) {
  const s = scale();
  let p = null;
  if (sweepStart != null) {
    const t = (now - sweepStart) / SWEEP;
    if (t >= 1) sweepStart = null; else p = ease(Math.max(0, t));
  }
  renderTo(canvas, s, p);
  if (sweepStart != null) requestAnimationFrame(frame);
}

Promise.all([
  document.fonts.load('148px "Permanent Marker"', 'Music'),
  document.fonts.load('italic 800 40px "Barlow Condensed"', 'LIFE'),
]).catch(() => {}).then(() => {
  requestAnimationFrame(frame);
  addEventListener('resize', () => requestAnimationFrame(frame));
  if (PNG_MODE) {
    const make = (px, a) => { const c = document.createElement('canvas'); renderTo(c, px / (W + 2 * PAD), null); a.href = c.toDataURL('image/png'); };
    make(1280, document.getElementById('dl1'));
    make(2560, document.getElementById('dl2'));
    return;
  }
  const sweep = () => { sweepStart = performance.now(); requestAnimationFrame(frame); };
  setTimeout(sweep, 2000);          // premier reflet 2 s après l'ouverture
  setInterval(sweep, EVERY);        // puis toutes les 60 s (réglable)
});
</script>
</body>
</html>
